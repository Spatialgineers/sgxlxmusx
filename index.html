<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGX Multimodal Forge | AR/VR Engine</title>
    
    <!-- CORE DEPENDENCIES -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TACTICAL BRANDING & SCALING -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --sgx-blue: #32527B;
            --sgx-gold: #FDCC0D;
            --sgx-metal: #1A1A1A;
            --sgx-cyan: #00FFFF;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--sgx-metal);
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Previene zoom/scroll nativo del navegador */
            user-select: none;
        }

        /* Glassmorphism Tactical Panel */
        .sgx-panel {
            background: rgba(26, 26, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 2px solid var(--sgx-cyan);
            border-right: 2px solid var(--sgx-gold);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
            box-shadow: 0 -10px 30px rgba(0, 255, 255, 0.1);
        }

        /* Tactical Button */
        .sgx-btn {
            background: var(--sgx-blue);
            color: white;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid transparent;
        }
        
        .sgx-btn:hover, .sgx-btn:active {
            background: var(--sgx-cyan);
            color: var(--sgx-metal);
            transform: scale(1.02);
        }

        .sgx-btn-gold {
            background: var(--sgx-gold);
            color: var(--sgx-metal);
        }

        /* Select / Inputs */
        .sgx-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--sgx-cyan);
            color: var(--sgx-cyan);
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
            outline: none;
        }

        /* Ocultar UI nativo de A-Frame */
        .a-enter-vr { display: none !important; }
        
        /* Ocultar input file original */
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- DOM OVERLAY UI (Renderizado sobre AR/VR y Web) -->
    <div id="sgx-ui" class="fixed inset-0 z-50 pointer-events-none flex flex-col justify-between">
        
        <!-- TOP HUD -->
        <div class="p-4 flex justify-between items-start w-full">
            <div>
                <h1 class="font-black text-[#00FFFF] tracking-widest text-xl drop-shadow-md">SGX FORGE</h1>
                <p class="text-[#FDCC0D] text-xs tracking-widest font-bold">MULTIMODAL XR ENGINE</p>
            </div>
            <div id="status-badge" class="bg-red-500/20 text-red-400 border border-red-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md">
                MODO 2D
            </div>
        </div>

        <!-- BOTTOM CONTROL PANEL -->
        <div class="sgx-panel p-4 sm:p-6 w-full max-w-lg mx-auto pointer-events-auto flex flex-col gap-4">
            
            <!-- CONTROLES DE MODELO Y ANIMACIÓN -->
            <div class="flex flex-col gap-3">
                <label class="sgx-btn cursor-pointer p-3 text-center text-xs flex justify-center items-center gap-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    CARGAR MODELO LOCAL (.GLB)
                    <input type="file" id="glb-upload" accept=".glb,.gltf">
                </label>

                <!-- ANIMATION CONTROLS (Ocultos hasta que haya animación) -->
                <div id="anim-controls" class="hidden flex gap-2 w-full">
                    <select id="anim-select" class="sgx-input p-3 text-xs w-2/3 cursor-pointer">
                        <option value="">Seleccionar Animación...</option>
                    </select>
                    <button id="btn-play-pause" class="sgx-btn p-3 w-1/3 text-xs flex justify-center items-center gap-1">
                        <span id="play-icon">⏸</span> PAUSA
                    </button>
                </div>
            </div>

            <!-- CONTROLES DE INMERSIÓN -->
            <div class="flex gap-2 w-full pt-2 border-t border-gray-700/50">
                <button id="btn-ar" class="sgx-btn sgx-btn-gold p-3 flex-1 text-sm flex justify-center items-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg>
                    ENTRAR AR
                </button>
                <button id="btn-vr" class="sgx-btn p-3 flex-1 text-sm flex justify-center items-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-9 5 18 3-9h5"></path></svg>
                    ENTRAR VR
                </button>
            </div>
            <p class="text-gray-400 text-[10px] text-center uppercase tracking-widest mt-1">Interacción: Un dedo para rotar. Dos dedos (Pinch) para escalar.</p>
        </div>
    </div>

    <!-- WEBXR SCENE ENGINE -->
    <!-- overlayElement inyecta la UI en sesiones inmersivas soportadas -->
    <a-scene 
        sgx-multimodal-engine
        webxr="referenceSpaceType: local-floor; optionalFeatures: dom-overlay, hit-test, local-floor; overlayElement: #sgx-ui"
        background="color: #1A1A1A; transparent: false"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        device-orientation-permission-ui="enabled: false">
        
        <!-- CÁMARA & MANOS -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" position="0 1.6 0" look-controls="enabled: false"></a-camera>
            <!-- Controladores para VR -->
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
        </a-entity>

        <!-- CONTENEDOR DEL HOLOGRAMA (Centro de rotación y escala) -->
        <a-entity id="hologram-anchor" position="0 1 -2" rotation="0 0 0" scale="1 1 1">
            <!-- Entidad Dinámica donde inyectamos el modelo -->
            <a-entity 
                id="dynamic-model"
                shadow="cast: true; receive: false">
            </a-entity>
            
            <!-- Piso de Sombra Oculto (Aparece en AR para grounding visual) -->
            <a-plane id="shadow-plane"
                position="0 -1 0" 
                rotation="-90 0 0" 
                width="10" height="10" 
                material="shader: flat; color: #000000; opacity: 0.3; transparent: true"
                shadow="receive: true"
                visible="false">
            </a-plane>
        </a-entity>

        <!-- ILUMINACIÓN -->
        <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
        <a-light type="directional" color="#FDCC0D" intensity="1.5" position="1 3 2" castShadow="true" shadow-mapSize="1024"></a-light>
        <a-light type="directional" color="#00FFFF" intensity="0.5" position="-2 1 -1"></a-light>
    </a-scene>

    <!-- CORE LOGIC: SGX ENGINE -->
    <script>
        AFRAME.registerComponent('sgx-multimodal-engine', {
            init: function () {
                const scene = this.el;
                const modelEntity = document.getElementById('dynamic-model');
                const hologramAnchor = document.getElementById('hologram-anchor');
                const shadowPlane = document.getElementById('shadow-plane');
                const statusBadge = document.getElementById('status-badge');
                
                // UI Elements
                const fileInput = document.getElementById('glb-upload');
                const animControls = document.getElementById('anim-controls');
                const animSelect = document.getElementById('anim-select');
                const btnPlayPause = document.getElementById('btn-play-pause');
                const iconPlay = document.getElementById('play-icon');
                const btnAR = document.getElementById('btn-ar');
                const btnVR = document.getElementById('btn-vr');

                let isPlaying = true;
                let currentObjectUrl = null;
                let isDragging = false;
                let previousTouch = { x: 0, y: 0 };
                let initialPinchDistance = null;
                let initialScale = { x: 1, y: 1, z: 1 };

                // 1. GESTIÓN DE CARGA LOCAL
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    // Limpiar URL anterior de la memoria
                    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                    
                    // Crear blob local
                    currentObjectUrl = URL.createObjectURL(file);
                    
                    // Purgar modelo anterior y cargar nuevo
                    modelEntity.removeAttribute('gltf-model');
                    modelEntity.removeAttribute('animation-mixer');
                    modelEntity.setAttribute('gltf-model', currentObjectUrl);
                    
                    // Resetear escala y rotación
                    hologramAnchor.setAttribute('scale', '1 1 1');
                    hologramAnchor.setAttribute('rotation', '0 0 0');
                });

                // 2. PARSEO DE ANIMACIONES AL CARGAR MODELO
                modelEntity.addEventListener('model-loaded', (e) => {
                    const model = e.detail.model;
                    const animations = model.animations;
                    
                    animSelect.innerHTML = ''; // Limpiar select
                    
                    if (animations && animations.length > 0) {
                        animControls.classList.remove('hidden');
                        animControls.classList.add('flex');
                        
                        // Llenar dropdown
                        animations.forEach((anim, index) => {
                            const option = document.createElement('option');
                            option.value = anim.name;
                            option.textContent = anim.name;
                            animSelect.appendChild(option);
                        });

                        // Arrancar primera animación
                        modelEntity.setAttribute('animation-mixer', `clip: ${animations[0].name}; loop: repeat; timeScale: 1`);
                        isPlaying = true;
                        iconPlay.textContent = '⏸';
                    } else {
                        animControls.classList.add('hidden');
                        animControls.classList.remove('flex');
                    }
                });

                // 3. EVENTOS DE CONTROL DE ANIMACIÓN
                animSelect.addEventListener('change', (e) => {
                    const clipName = e.target.value;
                    modelEntity.setAttribute('animation-mixer', `clip: ${clipName}; timeScale: ${isPlaying ? 1 : 0}`);
                });

                btnPlayPause.addEventListener('click', () => {
                    isPlaying = !isPlaying;
                    iconPlay.textContent = isPlaying ? '⏸' : '▶';
                    btnPlayPause.innerHTML = `<span id="play-icon">${iconPlay.textContent}</span> ${isPlaying ? 'PAUSA' : 'PLAY'}`;
                    
                    // Actualizar velocidad
                    const currentClip = animSelect.value;
                    if(currentClip) {
                        modelEntity.setAttribute('animation-mixer', `clip: ${currentClip}; timeScale: ${isPlaying ? 1 : 0}`);
                    }
                });

                // 4. MÁQUINA DE ESTADO INMERSIVO (XR)
                btnAR.addEventListener('click', () => {
                    if (navigator.xr) {
                        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                            if (supported) {
                                scene.systems.webxr.startSession('immersive-ar');
                            } else {
                                alert("Tu navegador o dispositivo no soporta WebXR AR.");
                            }
                        });
                    }
                });

                btnVR.addEventListener('click', () => {
                    scene.systems.webxr.startSession('immersive-vr');
                });

                scene.addEventListener('enter-vr', () => {
                    if (scene.is('ar-mode')) {
                        // MODO AR: Transparente y sombra activada
                        scene.setAttribute('background', 'transparent: true');
                        shadowPlane.setAttribute('visible', 'true');
                        statusBadge.textContent = 'AR PASSTHROUGH';
                        statusBadge.className = 'bg-cyan-500/20 text-cyan-400 border border-cyan-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md';
                    } else {
                        // MODO VR: Espacio infinito
                        scene.setAttribute('background', 'color: #1A1A1A; transparent: false');
                        shadowPlane.setAttribute('visible', 'false');
                        statusBadge.textContent = 'VR INMERSIÓN';
                        statusBadge.className = 'bg-purple-500/20 text-purple-400 border border-purple-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md';
                    }
                });

                scene.addEventListener('exit-vr', () => {
                    scene.setAttribute('background', 'color: #1A1A1A; transparent: false');
                    shadowPlane.setAttribute('visible', 'false');
                    statusBadge.textContent = 'MODO 2D';
                    statusBadge.className = 'bg-red-500/20 text-red-400 border border-red-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md';
                });

                // 5. MOTOR DE INTERACCIÓN ESPACIAL (TOUCH/MOUSE)
                const isUIEvent = (e) => e.target.closest('.sgx-panel') || e.target.closest('button') || e.target.closest('select');

                // TOUCH (Móviles / AR)
                document.addEventListener('touchstart', (e) => {
                    if (isUIEvent(e)) return;
                    if (e.touches.length === 1) {
                        isDragging = true;
                        previousTouch = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                    } else if (e.touches.length === 2) {
                        isDragging = false;
                        const dx = e.touches[0].pageX - e.touches[1].pageX;
                        const dy = e.touches[0].pageY - e.touches[1].pageY;
                        initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                        initialScale = hologramAnchor.getAttribute('scale');
                    }
                }, { passive: false });

                document.addEventListener('touchmove', (e) => {
                    if (isUIEvent(e)) return;
                    e.preventDefault(); // Previene scroll de página
                    
                    if (e.touches.length === 1 && isDragging) {
                        const deltaX = e.touches[0].pageX - previousTouch.x;
                        const currentRot = hologramAnchor.getAttribute('rotation');
                        
                        // Rotar en el eje Y basándose en el movimiento X del dedo
                        hologramAnchor.setAttribute('rotation', {
                            x: currentRot.x,
                            y: currentRot.y + deltaX * 0.5,
                            z: currentRot.z
                        });
                        previousTouch = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                    } else if (e.touches.length === 2 && initialPinchDistance) {
                        const dx = e.touches[0].pageX - e.touches[1].pageX;
                        const dy = e.touches[0].pageY - e.touches[1].pageY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        const scaleMod = dist / initialPinchDistance;
                        hologramAnchor.setAttribute('scale', {
                            x: initialScale.x * scaleMod,
                            y: initialScale.y * scaleMod,
                            z: initialScale.z * scaleMod
                        });
                    }
                }, { passive: false });

                document.addEventListener('touchend', () => {
                    isDragging = false;
                    initialPinchDistance = null;
                });

                // MOUSE (Desktop 2D)
                document.addEventListener('mousedown', (e) => {
                    if (isUIEvent(e)) return;
                    isDragging = true;
                    previousTouch = { x: e.pageX, y: e.pageY };
                });

                document.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const deltaX = e.pageX - previousTouch.x;
                        const currentRot = hologramAnchor.getAttribute('rotation');
                        hologramAnchor.setAttribute('rotation', {
                            x: currentRot.x,
                            y: currentRot.y + deltaX * 0.5,
                            z: currentRot.z
                        });
                        previousTouch = { x: e.pageX, y: e.pageY };
                    }
                });

                document.addEventListener('mouseup', () => isDragging = false);

                // SCROLL WHEEL (Escala en Desktop)
                document.addEventListener('wheel', (e) => {
                    if (isUIEvent(e)) return;
                    const scale = hologramAnchor.getAttribute('scale');
                    const factor = e.deltaY > 0 ? 0.9 : 1.1; // Zoom in / out
                    hologramAnchor.setAttribute('scale', {
                        x: scale.x * factor,
                        y: scale.y * factor,
                        z: scale.z * factor
                    });
                }, { passive: true });
            }
        });
    </script>
</body>
</html>
