<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGX Multimodal Forge | AR/VR Engine</title>
    
    <!-- CORE DEPENDENCIES -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TACTICAL BRANDING & SCALING -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --sgx-blue: #32527B;
            --sgx-gold: #FDCC0D;
            --sgx-metal: #1A1A1A;
            --sgx-cyan: #00FFFF;
            --sgx-red: #FF0055;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--sgx-metal);
            margin: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* Glassmorphism Tactical Panel */
        .sgx-panel {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 2px solid var(--sgx-cyan);
            border-right: 2px solid var(--sgx-gold);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
            box-shadow: 0 -10px 30px rgba(0, 255, 255, 0.1);
        }

        /* Tactical Buttons */
        .sgx-btn {
            background: var(--sgx-blue);
            color: white;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }
        
        .sgx-btn:hover, .sgx-btn:active {
            background: var(--sgx-cyan);
            color: var(--sgx-metal);
            transform: scale(1.02);
        }

        .sgx-btn-gold { background: var(--sgx-gold); color: var(--sgx-metal); }
        .sgx-btn-red { background: var(--sgx-red); color: white; border-right: 2px solid white; }

        /* Select / Inputs */
        .sgx-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--sgx-cyan);
            color: var(--sgx-cyan);
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
            outline: none;
        }

        /* Cyberpunk Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(0, 255, 255, 0.3); border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%;
            background: var(--sgx-gold); cursor: pointer;
            -webkit-appearance: none; margin-top: -6px;
            box-shadow: 0 0 10px var(--sgx-gold);
        }

        .a-enter-vr { display: none !important; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- DOM OVERLAY UI (Renderizado sobre AR y Web 2D) -->
    <div id="sgx-ui" class="fixed inset-0 z-50 pointer-events-none flex flex-col justify-between">
        
        <!-- TOP HUD -->
        <div class="p-4 flex justify-between items-start w-full">
            <div>
                <h1 class="font-black text-[#00FFFF] tracking-widest text-xl drop-shadow-md">SGX FORGE</h1>
                <p class="text-[#FDCC0D] text-xs tracking-widest font-bold">MULTIMODAL XR ENGINE</p>
            </div>
            <div id="status-badge" class="bg-red-500/20 text-red-400 border border-red-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md transition-colors">
                MODO 2D
            </div>
        </div>

        <!-- BOTTOM CONTROL PANEL -->
        <div class="sgx-panel p-4 sm:p-6 w-full max-w-lg mx-auto pointer-events-auto flex flex-col gap-4">
            
            <div class="flex flex-col gap-3">
                <div class="flex gap-2">
                    <label class="sgx-btn cursor-pointer p-3 text-center text-xs flex justify-center items-center gap-2 flex-1">
                        CARGAR .GLB
                        <input type="file" id="glb-upload" accept=".glb,.gltf">
                    </label>
                    <button id="btn-lock" class="sgx-btn sgx-btn-red p-3 text-xs w-1/3 flex justify-center items-center gap-1">
                        🔓 EDIT
                    </button>
                </div>

                <!-- ANIMATION CONTROLS -->
                <div id="anim-controls" class="hidden flex gap-2 w-full">
                    <select id="anim-select" class="sgx-input p-3 text-xs w-2/3 cursor-pointer">
                        <option value="">Seleccionar Animación...</option>
                    </select>
                    <button id="btn-play-pause" class="sgx-btn p-3 w-1/3 text-xs flex justify-center items-center gap-1">
                        <span id="play-icon">⏸</span> PAUSA
                    </button>
                </div>

                <!-- SLIDER ESCALA GLOBAL -->
                <div class="flex flex-col gap-1 w-full mt-1">
                    <div class="flex justify-between">
                        <label class="text-[10px] text-[#00FFFF] tracking-widest font-bold">ESCALA DEL ACTIVO</label>
                        <span id="scale-readout" class="text-[10px] text-[#FDCC0D] font-mono">1.00x</span>
                    </div>
                    <input type="range" id="scale-slider" min="0.01" max="10" step="0.01" value="1">
                </div>
            </div>

            <!-- CONTROLES DE INMERSIÓN -->
            <div class="flex gap-2 w-full pt-2 border-t border-gray-700/50">
                <button id="btn-ar" class="sgx-btn sgx-btn-gold p-3 flex-1 text-sm flex justify-center items-center gap-2">
                    ENTRAR AR
                </button>
                <button id="btn-vr" class="sgx-btn p-3 flex-1 text-sm flex justify-center items-center gap-2">
                    ENTRAR VR
                </button>
            </div>
        </div>
    </div>

    <!-- WEBXR SCENE ENGINE -->
    <a-scene 
        sgx-multimodal-engine
        webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, hit-test, dom-overlay; overlayElement: #sgx-ui"
        background="color: #1A1A1A; transparent: false"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        device-orientation-permission-ui="enabled: false">
        
        <!-- CÁMARA & LOCOMOCIÓN -->
        <a-entity id="rig" movement-controls="fly: true; speed: 0.3" position="0 0 0">
            <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-camera>
            
            <!-- CONTROLADOR IZQUIERDO: WRIST UI PARA VR -->
            <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .clickable; far: 5">
                <a-entity id="tactical-wrist-ui" position="0 0.15 0.05" rotation="-45 0 0" visible="false">
                    <a-plane width="0.3" height="0.18" color="#1A1A1A" opacity="0.9" material="shader: flat" class="clickable">
                        <a-text value="SGX WRIST COMMAND" position="0 0.07 0.01" width="0.8" align="center" color="#00FFFF"></a-text>
                        
                        <!-- VR Btn: Next Anim -->
                        <a-plane id="vr-btn-anim" class="clickable" position="0 0.03 0.01" width="0.26" height="0.03" color="#32527B">
                            <a-text value="Siguiente Animacion" align="center" width="0.8" color="#FFF"></a-text>
                        </a-plane>

                        <!-- VR Btn: Play/Pause -->
                        <a-plane id="vr-btn-play" class="clickable" position="0 -0.01 0.01" width="0.26" height="0.03" color="#FDCC0D">
                            <a-text id="vr-text-play" value="PAUSAR" align="center" width="0.8" color="#1A1A1A"></a-text>
                        </a-plane>

                        <!-- VR Btn: Lock -->
                        <a-plane id="vr-btn-lock" class="clickable" position="0 -0.05 0.01" width="0.26" height="0.03" color="#FF0055">
                            <a-text id="vr-text-lock" value="MODO: EDIT (DESBLOQUEADO)" align="center" width="0.8" color="#FFF"></a-text>
                        </a-plane>
                    </a-plane>
                </a-entity>
            </a-entity>
            
            <!-- CONTROLADOR DERECHO: INTERACCIÓN Y MANIPULACIÓN -->
            <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .clickable; far: 5" sgx-vr-manipulator></a-entity>
        </a-entity>

        <!-- CONTENEDOR DEL HOLOGRAMA: Pegado al piso absoluto (Y=0) -->
        <a-entity id="hologram-anchor" position="0 0 -2" rotation="0 0 0" scale="1 1 1">
            <a-entity id="dynamic-model" shadow="cast: true; receive: false"></a-entity>
            
            <a-plane id="shadow-plane" position="0 0.01 0" rotation="-90 0 0" width="10" height="10" 
                material="shader: flat; color: #000000; opacity: 0.4; transparent: true"
                shadow="receive: true" visible="false">
            </a-plane>
        </a-entity>

        <!-- ILUMINACIÓN -->
        <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
        <a-light type="directional" color="#FDCC0D" intensity="1.5" position="1 3 2" castShadow="true" shadow-mapSize="1024"></a-light>
        <a-light type="directional" color="#00FFFF" intensity="0.5" position="-2 1 -1"></a-light>
        
        <!-- Grid Floor visual -->
        <a-entity id="vr-grid" sgx-grid position="0 0 0" visible="true"></a-entity>
    </a-scene>

    <!-- CORE LOGIC: SGX ENGINE -->
    <script>
        // ESTADO GLOBAL COMPARTIDO (Evita desincronización entre 2D y 3D)
        window.SGX_STATE = {
            locked: false,
            playing: true,
            animations: [],
            currentAnimIndex: 0
        };

        // 0. GENERADOR DE GRID ESPACIAL TÁCTICO
        AFRAME.registerComponent('sgx-grid', {
            init: function () {
                const size = 100; const divisions = 100;
                const colorCenterLine = new THREE.Color(0x00FFFF); 
                const colorGrid = new THREE.Color(0x32527B); 
                const gridHelper = new THREE.GridHelper(size, divisions, colorCenterLine, colorGrid);
                gridHelper.material.opacity = 0.25;
                gridHelper.material.transparent = true;
                this.el.setObject3D('grid', gridHelper);
            }
        });

        // 1. COMPONENTE DE MANIPULACIÓN PARA CONTROLES VR
        AFRAME.registerComponent('sgx-vr-manipulator', {
            init: function () {
                this.anchor = document.getElementById('hologram-anchor');
                this.scaleSlider = document.getElementById('scale-slider');
                this.scaleReadout = document.getElementById('scale-readout');
                this.el.addEventListener('thumbstickmoved', this.onThumbstickMoved.bind(this));
            },
            onThumbstickMoved: function (evt) {
                if (!this.anchor || window.SGX_STATE.locked) return; // Si está locked, aborta manipulación
                
                const x = evt.detail.x; 
                const y = evt.detail.y; 

                if (Math.abs(x) > 0.1) {
                    const currentRot = this.anchor.getAttribute('rotation');
                    this.anchor.setAttribute('rotation', { x: currentRot.x, y: currentRot.y + (x * 3), z: currentRot.z });
                }

                if (Math.abs(y) > 0.1) {
                    const currentScale = this.anchor.getAttribute('scale').x;
                    let factor = 1 - (y * 0.05); 
                    let newScale = Math.max(0.01, Math.min(10, currentScale * factor));
                    this.anchor.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
                    if(this.scaleSlider) {
                        this.scaleSlider.value = newScale;
                        this.scaleReadout.textContent = newScale.toFixed(2) + "x";
                    }
                }
            }
        });

        // 2. MOTOR MULTIMODAL PRINCIPAL
        AFRAME.registerComponent('sgx-multimodal-engine', {
            init: function () {
                const scene = this.el;
                const modelEntity = document.getElementById('dynamic-model');
                const hologramAnchor = document.getElementById('hologram-anchor');
                const shadowPlane = document.getElementById('shadow-plane');
                const vrGrid = document.getElementById('vr-grid');
                const statusBadge = document.getElementById('status-badge');
                const uiContainer = document.getElementById('sgx-ui');
                const wristUI = document.getElementById('tactical-wrist-ui');
                
                // UI Elements 2D
                const fileInput = document.getElementById('glb-upload');
                const animControls = document.getElementById('anim-controls');
                const animSelect = document.getElementById('anim-select');
                const btnPlayPause = document.getElementById('btn-play-pause');
                const iconPlay = document.getElementById('play-icon');
                const btnLock = document.getElementById('btn-lock');
                const scaleSlider = document.getElementById('scale-slider');
                const scaleReadout = document.getElementById('scale-readout');

                // UI Elements 3D
                const vrBtnAnim = document.getElementById('vr-btn-anim');
                const vrBtnPlay = document.getElementById('vr-btn-play');
                const vrTextPlay = document.getElementById('vr-text-play');
                const vrBtnLock = document.getElementById('vr-btn-lock');
                const vrTextLock = document.getElementById('vr-text-lock');

                let currentObjectUrl = null;
                let isDragging = false;
                let previousTouch = { x: 0, y: 0 };
                let initialPinchDistance = null;
                let initialScale = 1;

                // RUTINAS DE ESTADO GLOBAL
                const updatePlayState = () => {
                    iconPlay.textContent = window.SGX_STATE.playing ? '⏸' : '▶';
                    btnPlayPause.innerHTML = `<span id="play-icon">${iconPlay.textContent}</span> ${window.SGX_STATE.playing ? 'PAUSA' : 'PLAY'}`;
                    vrTextPlay.setAttribute('value', window.SGX_STATE.playing ? 'PAUSAR' : 'REPRODUCIR');
                    
                    if(window.SGX_STATE.animations.length > 0) {
                        const currentClip = window.SGX_STATE.animations[window.SGX_STATE.currentAnimIndex].name;
                        modelEntity.setAttribute('animation-mixer', `clip: ${currentClip}; timeScale: ${window.SGX_STATE.playing ? 1 : 0}`);
                    }
                };

                const updateLockState = () => {
                    btnLock.innerHTML = window.SGX_STATE.locked ? '🔒 LOCKED' : '🔓 EDIT';
                    btnLock.className = window.SGX_STATE.locked 
                        ? 'sgx-btn p-3 text-xs w-1/3 flex justify-center items-center gap-1 bg-green-600 text-white' 
                        : 'sgx-btn sgx-btn-red p-3 text-xs w-1/3 flex justify-center items-center gap-1';
                    
                    vrTextLock.setAttribute('value', window.SGX_STATE.locked ? 'MODO: LOCKED' : 'MODO: EDIT (DESBLOQUEADO)');
                    vrBtnLock.setAttribute('color', window.SGX_STATE.locked ? '#16a34a' : '#FF0055');
                    
                    // Deshabilitar/Habilitar slider en 2D
                    scaleSlider.disabled = window.SGX_STATE.locked;
                };

                const changeToNextAnimation = () => {
                    if (window.SGX_STATE.animations.length === 0) return;
                    window.SGX_STATE.currentAnimIndex = (window.SGX_STATE.currentAnimIndex + 1) % window.SGX_STATE.animations.length;
                    const clipName = window.SGX_STATE.animations[window.SGX_STATE.currentAnimIndex].name;
                    animSelect.value = clipName;
                    updatePlayState();
                };

                // LISTENERS 3D VR WRIST UI
                vrBtnAnim.addEventListener('click', changeToNextAnimation);
                vrBtnPlay.addEventListener('click', () => {
                    window.SGX_STATE.playing = !window.SGX_STATE.playing;
                    updatePlayState();
                });
                vrBtnLock.addEventListener('click', () => {
                    window.SGX_STATE.locked = !window.SGX_STATE.locked;
                    updateLockState();
                });

                // LISTENERS 2D UI
                btnPlayPause.addEventListener('click', () => {
                    window.SGX_STATE.playing = !window.SGX_STATE.playing;
                    updatePlayState();
                });
                btnLock.addEventListener('click', () => {
                    window.SGX_STATE.locked = !window.SGX_STATE.locked;
                    updateLockState();
                });
                animSelect.addEventListener('change', (e) => {
                    const idx = window.SGX_STATE.animations.findIndex(a => a.name === e.target.value);
                    if(idx !== -1) window.SGX_STATE.currentAnimIndex = idx;
                    updatePlayState();
                });

                // DIRECT BINARY INJECTION
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const buffer = event.target.result;
                        const loader = new THREE.GLTFLoader();
                        loader.parse(buffer, '', (gltf) => {
                            modelEntity.removeAttribute('animation-mixer');
                            if (modelEntity.getObject3D('mesh')) modelEntity.removeObject3D('mesh');
                            
                            const newMesh = gltf.scene;
                            newMesh.animations = gltf.animations || [];
                            modelEntity.setObject3D('mesh', newMesh);
                            
                            hologramAnchor.setAttribute('scale', '1 1 1');
                            hologramAnchor.setAttribute('rotation', '0 0 0');
                            scaleSlider.value = 1;
                            scaleReadout.textContent = "1.00x";
                            
                            modelEntity.emit('model-loaded', { format: 'gltf', model: newMesh });
                        }, (error) => alert("Fallo de Ingesta: Archivo GLB no válido."));
                    };
                    if (file.name.toLowerCase().endsWith('.gltf')) reader.readAsText(file);
                    else reader.readAsArrayBuffer(file);
                });

                modelEntity.addEventListener('model-loaded', (e) => {
                    const model = e.detail.model;
                    window.SGX_STATE.animations = model.animations || [];
                    window.SGX_STATE.currentAnimIndex = 0;
                    animSelect.innerHTML = '';
                    
                    if (window.SGX_STATE.animations.length > 0) {
                        animControls.classList.remove('hidden');
                        animControls.classList.add('flex');
                        window.SGX_STATE.animations.forEach(anim => {
                            const option = document.createElement('option');
                            option.value = anim.name; option.textContent = anim.name;
                            animSelect.appendChild(option);
                        });
                        setTimeout(() => updatePlayState(), 50);
                    } else {
                        animControls.classList.add('hidden');
                        animControls.classList.remove('flex');
                    }
                });

                const updateScale = (val) => {
                    if(window.SGX_STATE.locked) return;
                    const newScale = parseFloat(val);
                    hologramAnchor.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
                    scaleReadout.textContent = newScale.toFixed(2) + "x";
                };
                scaleSlider.addEventListener('input', (e) => updateScale(e.target.value));

                // ESTADO INMERSIVO Y WRIST UI
                document.getElementById('btn-ar').addEventListener('click', () => { if (scene.hasLoaded) scene.enterAR(); });
                document.getElementById('btn-vr').addEventListener('click', () => { if (scene.hasLoaded) scene.enterVR(); });

                scene.addEventListener('enter-vr', () => {
                    if (scene.is('ar-mode')) {
                        // En AR WebXR en Móvil el overlay DOM domina, escondemos el wrist UI por seguridad.
                        wristUI.setAttribute('visible', 'false');
                        scene.setAttribute('background', 'transparent: true');
                        shadowPlane.setAttribute('visible', 'true');
                        vrGrid.setAttribute('visible', 'false');
                        statusBadge.textContent = 'AR PASSTHROUGH';
                        statusBadge.className = 'bg-cyan-500/20 text-cyan-400 border border-cyan-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md';
                    } else {
                        // MODO VR GAFAS: Mostramos el menu en la muñeca y ocultamos DOM
                        uiContainer.style.opacity = '0';
                        wristUI.setAttribute('visible', 'true');
                        scene.setAttribute('background', 'color: #1A1A1A; transparent: false');
                        shadowPlane.setAttribute('visible', 'false');
                        vrGrid.setAttribute('visible', 'true');
                    }
                });

                scene.addEventListener('exit-vr', () => {
                    uiContainer.style.opacity = '1';
                    wristUI.setAttribute('visible', 'false');
                    scene.setAttribute('background', 'color: #1A1A1A; transparent: false');
                    shadowPlane.setAttribute('visible', 'false');
                    vrGrid.setAttribute('visible', 'true');
                    statusBadge.textContent = 'MODO 2D';
                    statusBadge.className = 'bg-red-500/20 text-red-400 border border-red-500 px-3 py-1 text-[10px] tracking-widest rounded-sm backdrop-blur-md';
                });

                // INTERACCIÓN ESPACIAL 2D/TÁCTIL (Bloqueada si Locked)
                const isUIEvent = (e) => e.target.closest('.sgx-panel') || e.target.closest('.clickable') || e.target.closest('input');

                document.addEventListener('touchstart', (e) => {
                    if (isUIEvent(e) || window.SGX_STATE.locked) return;
                    if (e.touches.length === 1) {
                        isDragging = true; previousTouch = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                    } else if (e.touches.length === 2) {
                        isDragging = false;
                        const dx = e.touches[0].pageX - e.touches[1].pageX; const dy = e.touches[0].pageY - e.touches[1].pageY;
                        initialPinchDistance = Math.sqrt(dx * dx + dy * dy); initialScale = parseFloat(scaleSlider.value);
                    }
                }, { passive: false });

                document.addEventListener('touchmove', (e) => {
                    if (isUIEvent(e) || window.SGX_STATE.locked) return;
                    e.preventDefault(); 
                    if (e.touches.length === 1 && isDragging) {
                        const deltaX = e.touches[0].pageX - previousTouch.x;
                        const currentRot = hologramAnchor.getAttribute('rotation');
                        hologramAnchor.setAttribute('rotation', { x: currentRot.x, y: currentRot.y + deltaX * 0.5, z: currentRot.z });
                        previousTouch = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                    } else if (e.touches.length === 2 && initialPinchDistance) {
                        const dx = e.touches[0].pageX - e.touches[1].pageX; const dy = e.touches[0].pageY - e.touches[1].pageY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        let newScale = initialScale * (dist / initialPinchDistance);
                        newScale = Math.max(0.01, Math.min(10, newScale)); 
                        scaleSlider.value = newScale; updateScale(newScale);
                    }
                }, { passive: false });

                document.addEventListener('touchend', () => { isDragging = false; initialPinchDistance = null; });
                document.addEventListener('mousedown', (e) => { if (isUIEvent(e) || window.SGX_STATE.locked) return; isDragging = true; previousTouch = { x: e.pageX, y: e.pageY }; });
                document.addEventListener('mousemove', (e) => {
                    if (isDragging && !window.SGX_STATE.locked) {
                        const deltaX = e.pageX - previousTouch.x;
                        const currentRot = hologramAnchor.getAttribute('rotation');
                        hologramAnchor.setAttribute('rotation', { x: currentRot.x, y: currentRot.y + deltaX * 0.5, z: currentRot.z });
                        previousTouch = { x: e.pageX, y: e.pageY };
                    }
                });
                document.addEventListener('mouseup', () => isDragging = false);
            }
        });
    </script>
</body>
</html>
