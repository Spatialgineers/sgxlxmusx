<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGX AR Passthrough Engine | Meta Quest Ready</title>
    
    <!-- 1. CORE DEPENDENCIES (CDN) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. TACTICAL BRANDING & FLUID SCALING -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --sgx-blue: #32527B;
            --sgx-gold: #FDCC0D;
            --sgx-metal: #1A1A1A;
            --sgx-cyan: #00FFFF;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--sgx-metal);
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        /* Glassmorphism Panel con cortes a 45 grados */
        .sgx-panel {
            background: rgba(50, 82, 123, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 2px solid var(--sgx-cyan);
            border-bottom: 2px solid var(--sgx-gold);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
            width: clamp(280px, 90vw, 500px);
        }

        /* Botón Táctico */
        .sgx-btn {
            background: var(--sgx-gold);
            color: var(--sgx-metal);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            transition: all 0.2s ease-in-out;
        }
        
        .sgx-btn:hover, .sgx-btn:active {
            background: var(--sgx-cyan);
            transform: scale(1.02);
        }

        /* Ocultar UI de A-Frame por defecto para mantener "Clean Look" */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

    <!-- 3. SGX TACTICAL UI (HUD) -->
    <div id="sgx-ui" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none transition-opacity duration-500">
        <div class="sgx-panel p-6 sm:p-10 flex flex-col items-center shadow-2xl pointer-events-auto">
            <h1 class="font-black text-[#00FFFF] tracking-widest text-center uppercase mb-2" style="font-size: clamp(1.5rem, 4vw, 2.5rem);">
                SGX AR CORE
            </h1>
            <p class="text-[#FDCC0D] text-xs tracking-widest mb-6 font-bold">SPATIALGINEERS LLC</p>
            
            <p class="text-gray-200 text-center mb-8" style="font-size: clamp(0.8rem, 1.5vw, 1rem); line-height: 1.6;">
                MOTOR PASSTHROUGH INICIALIZADO.<br>
                MODELO GLB ANCLADO A LOCAL-FLOOR.<br>
                COLÓCATE EL QUEST Y ACTIVA LA INMERSIÓN.
            </p>

            <button id="btn-start-ar" class="sgx-btn font-black py-4 px-10 tracking-widest flex items-center gap-3">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                ENTRAR A REALIDAD AUMENTADA
            </button>
        </div>
    </div>

    <!-- 4. WEBXR SCENE ENGINE -->
    <!-- referenceSpaceType: local-floor garantiza que Y=0 es el piso real del Quest/Móvil -->
    <a-scene 
        sgx-core-logic
        webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, hit-test;"
        background="transparent: true"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        device-orientation-permission-ui="enabled: false">
        
        <!-- ASSETS -->
        <a-assets>
            <!-- Modelo GLB animado público y altamente optimizado (Fox de Khronos) -->
            <a-asset-item id="glb-model" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/Fox/glTF-Binary/Fox.glb" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <!-- CÁMARA (Rig) -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" position="0 1.6 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
        </a-entity>

        <!-- HOLOGRAMA ANCLADO AL PISO -->
        <a-entity id="hologram-container" position="0 0 -2" visible="false">
            
            <!-- Modelo Animado. animation-mixer procesa el esqueleto. -->
            <!-- Scale adjust depends on the model. The Fox is big, scaled down. -->
            <a-entity 
                id="glb-entity"
                gltf-model="#glb-model" 
                scale="0.015 0.015 0.015" 
                rotation="0 -30 0"
                animation-mixer="clip: Walk; loop: repeat; timeScale: 1.2"
                shadow="cast: true; receive: false">
            </a-entity>

            <!-- Sombra de Contacto (Grounding) para maximizar inmersión en AR -->
            <a-plane 
                position="0 0.01 0" 
                rotation="-90 0 0" 
                width="2" height="2" 
                material="shader: flat; color: #1A1A1A; opacity: 0.4; transparent: true"
                shadow="receive: true">
            </a-plane>

        </a-entity>

        <!-- ILUMINACIÓN OPTIMIZADA (PBR) -->
        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#FDCC0D" intensity="1.5" position="1 3 2" castShadow="true" shadow-mapSize="1024" shadow-bias="-0.001"></a-light>
        <a-light type="directional" color="#00FFFF" intensity="0.5" position="-2 1 -1"></a-light>

    </a-scene>

    <!-- 5. LÓGICA DEFENSIVA Y DE CONTROL -->
    <script>
        AFRAME.registerComponent('sgx-core-logic', {
            init: function () {
                const scene = this.el;
                const uiLayer = document.getElementById('sgx-ui');
                const btnStart = document.getElementById('btn-start-ar');
                const hologram = document.getElementById('hologram-container');
                const glbEntity = document.getElementById('glb-entity');

                // Defensive Programming: Desbloqueo forzado de Audio/Media Context al tap (Mobile Safari hack)
                const unlockMedia = () => {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    ctx.resume();
                    document.removeEventListener('touchstart', unlockMedia);
                };
                document.addEventListener('touchstart', unlockMedia, {once: true});

                // Botón Custom dispara la sesión Inmersiva (WebXR AR)
                btnStart.addEventListener('click', () => {
                    if (scene.systems.webxr) {
                        // Verifica si el dispositivo soporta AR nativo (Quest Passthrough / ARCore)
                        if (navigator.xr) {
                            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                                if (supported) {
                                    scene.systems.webxr.startSession('immersive-ar');
                                } else {
                                    alert("El navegador no soporta WebXR AR. Abriendo en 3D Viewer 360.");
                                    scene.enterVR(); // Fallback a VR/3D regular
                                }
                            });
                        } else {
                            scene.enterVR();
                        }
                    }
                });

                // Listener: Entrar a modo Inmersivo
                scene.addEventListener('enter-vr', () => {
                    // Ocultamos la UI Glassmorphism para inmersión total (0 fricción visual)
                    uiLayer.style.opacity = "0";
                    setTimeout(() => uiLayer.style.pointerEvents = "none", 500);

                    // Validamos si entramos en AR (Passthrough)
                    if (scene.is('ar-mode')) {
                        hologram.setAttribute('visible', 'true');
                        // Aseguramos la animación
                        glbEntity.setAttribute('animation-mixer', 'clip: *; loop: repeat');
                    } else {
                        // Fallback VR (Espacio negro infinito)
                        scene.setAttribute('background', 'color: #1A1A1A; transparent: false');
                        hologram.setAttribute('visible', 'true');
                    }
                });

                // Listener: Salir de modo Inmersivo
                scene.addEventListener('exit-vr', () => {
                    // Restauramos UI
                    uiLayer.style.opacity = "1";
                    uiLayer.style.pointerEvents = "auto";
                    hologram.setAttribute('visible', 'false');
                    scene.setAttribute('background', 'transparent: true');
                });
            }
        });
    </script>
</body>
</html>
